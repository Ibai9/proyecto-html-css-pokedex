                        <div class="peso_altura">
                            <img src="https://static.thenounproject.com/png/142747-200.png" alt="icono_height"/>
                            <p>6.9 kg</p>
                            <img src="https://cdn-icons-png.flaticon.com/512/1008/1008002.png" alt="icono_weight"/>
                            <p>0.7 m</p>
                        </div>
                        <div class="estadisticas">
                            <span>
                                <p>HP</p> 
                                <label for="progreso">045:</label>
                                <progress id="progreso" value="20" max="100">20%</progress>
                            </span>
                            
                            <span>
                                <p>ATK</p> 
                                <label for="progreso">045:</label>
                                <progress id="progreso" value="20" max="100">20%</progress>

                            <span>
                                <p>DEF</p>
